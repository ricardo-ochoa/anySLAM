# Sinónimos del buscador de comandos.
#
# Cada lista es un grupo de equivalencias: escribir cualquiera de sus palabras
# encuentra los comandos que mencionan cualquier otra. Así "eliminar volumen"
# encuentra `docker volume rm` y `docker volume prune` aunque ninguno de los dos
# contenga la palabra "eliminar".
#
# Los términos que empiezan con espacio (" ls", " rm") se buscan con el espacio
# incluido: evitan que "rm" haga match dentro de "format" o de "permisos".
# La búsqueda ignora acentos y mayúsculas, así que aquí se escriben sin acento.

