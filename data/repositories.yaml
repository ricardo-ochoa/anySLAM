# ---------------------------------------------------------------------------
# Catálogo de repositorios del proyecto anySLAM.
#
# ESTE ARCHIVO ES LA FUENTE ÚNICA DE VERDAD del catálogo.
# Las tablas en docs/03-repositories/repository-catalog.{mdx,en.mdx} se
# GENERAN desde aquí con `npm run gen:catalog`. No las edites a mano.
#
# Campo `confidence` — qué tan verificada está la entrada:
#   confirmed : leído directamente del repositorio o de una fuente pública
#   inferred  : deducido de contexto (póster ICRA, nombre del repo). Verificar.
#   unknown   : no tenemos acceso. Pendiente de que su responsable lo complete.
#
# Campo `last_push` — fecha del último commit en la rama por defecto, no del
# último empuje al repositorio. Son cosas distintas: FLOWMAS-ANYmal registra
# actividad reciente en otras ramas mientras `main` lleva parado desde agosto
# de 2025, y lo que importa aquí es si el código principal se movió.
#
# Última verificación: 2026-10-19 (leído con la API de GitHub y los README de
# cada repositorio)
# ---------------------------------------------------------------------------

repositories:
  - id: anymal-research
    name: Anymal-Research
    url: https://github.com/jesusMBhuy/Anymal-Research
    visibility: public
    area: Aprendizaje / Locomoción
    area_en: Learning / Locomotion
    owner: jesusMBhuy
    owner_name: Jesús M. B.
    status: Active
    language: Python
    license: None
    last_push: 2026-06-23
    confidence: confirmed
    description: >-
      Entrenamiento por refuerzo de políticas de locomoción para el ANYmal D en
      NVIDIA Isaac Lab 5.0 / Isaac Sim 5.0 (PPO via RSL-RL, 4096 entornos en
      paralelo, curriculum de terreno, actuadores modelados con LSTM), más un
      workspace ROS 2 (`anymal_controller`) que despliega la política entrenada
      en formato PyTorch al robot real.
    description_en: >-
      Reinforcement-learning training of locomotion policies for the ANYmal D on
      NVIDIA Isaac Lab 5.0 / Isaac Sim 5.0 (PPO via RSL-RL, 4096 parallel
      environments, terrain curriculum, LSTM-modelled actuators), plus a ROS 2
      workspace (`anymal_controller`) that deploys the trained PyTorch policy to
      the physical robot.

  - id: ros2-anymal-slam
    name: ros2-anymal-slam
    url: https://github.com/Alponcho6594/ros2-anymal-slam
    visibility: private
    area: SLAM y localización
    area_en: SLAM and localisation
    owner: Alponcho6594
    owner_name: Genaro R
    owner_url: none
    status: Active
    language: C++ / CUDA
    license: None
    last_push: 2026-08-21
    confidence: confirmed
    description: >-
      Framework de SLAM y localización Monte Carlo acelerado por CUDA sobre
      ROS 2. Implementa filtro de partículas, mapeo por rejilla de ocupación con
      log-odds, campo de verosimilitud, graph SLAM con keyframes y cierre de
      bucle. Incluye el cliente del puente gRPC que traduce los datos del ANYmal
      en ROS 1 a los tópicos `/scan` y `/odom` de ROS 2. Todo corre en Docker,
      con detección automática de plataforma (Jetson JetPack 4/5/6 o escritorio)
      y de distribución de ROS 2.
    description_en: >-
      CUDA-accelerated SLAM and Monte Carlo Localization framework on ROS 2. It
      implements a particle filter, log-odds occupancy-grid mapping, a likelihood
      field, and graph SLAM with keyframes and loop closure. It includes the gRPC
      bridge client that translates the ANYmal's ROS 1 data into the ROS 2
      `/scan` and `/odom` topics. Everything runs in Docker, with automatic
      platform detection (Jetson JetPack 4/5/6 or desktop) and ROS 2
      distribution selection.

  - id: ros1-anymal-client
    name: ros1-anymal-client
    url: https://github.com/Alponcho6594/ros1-anymal-client
    visibility: private
    area: Comunicación / ROS 1
    area_en: Communication / ROS 1
    owner: Alponcho6594
    owner_name: Genaro R
    owner_url: none
    status: Active
    language: Python / Docker
    license: None
    last_push: 2026-08-03
    confidence: confirmed
    description: >-
      Entorno Docker con un cliente ROS 1 para hablar con el máster ROS del
      ANYmal sin instalar la pila completa de ANYbotics en la máquina de
      desarrollo. Incluye las definiciones de mensajes, servicios y acciones del
      robot (`anymal_interfaces`), gestión del lease de control, teleoperación
      por teclado, grabación y reproducción de rosbags, y el servidor gRPC que
      transmite odometría y escaneos al lado ROS 2.
    description_en: >-
      A Docker environment with a ROS 1 client for talking to the ANYmal's ROS
      master without installing the full ANYbotics stack on the development
      machine. It ships the robot's message, service and action definitions
      (`anymal_interfaces`), control-lease management, keyboard teleoperation,
      rosbag recording and replay, and the gRPC server that streams odometry and
      scans to the ROS 2 side.

  - id: flowmas-anymal
    name: FLOWMAS-ANYmal
    url: https://github.com/carloAdr1/FLOWMAS-ANYmal
    visibility: private
    area: Navegación / Modelos generativos
    area_en: Navigation / Generative models
    owner: carloAdr1
    owner_name: carloAdr1
    status: Research
    language: Python
    license: None
    last_push: 2025-08-29
    confidence: confirmed
    description: >-
      Generación de trayectorias con flow matching, sucesor del trabajo del
      póster de ICRA 2025. Los 18 commits están firmados por
      [@saucesaft](https://github.com/saucesaft), Eduardo Hernández Valdez, que es
      quien presentó ese póster. El paquete se llama
      `trajectory`. Entrena sobre capturas RGB + profundidad almacenadas en Zarr,
      con dos codificadores ResNet-18 separados —uno para color y otro para
      profundidad— y predice trayectorias en SE(3): 3 de traslación más 6 de
      rotación. Incluye variantes UNet, transformer y UNet con memoria espacial,
      y flow matching restringido. El código no menciona al ANYmal en ninguna
      parte: es agnóstico a la plataforma, pensado para reutilizarse en otros
      robots. `main` no se ha movido desde agosto de 2025, aunque el repositorio
      registra empujes posteriores en otras ramas.
    description_en: >-
      Trajectory generation with flow matching, successor to the ICRA 2025 poster
      work. All 18 commits are authored by
      [@saucesaft](https://github.com/saucesaft), Eduardo Hernández Valdez, who presented
      that poster. The package is named `trajectory`.
      It trains on RGB + depth captures stored in Zarr, with two separate
      ResNet-18 encoders —one for colour and one for depth— and predicts SE(3)
      trajectories: 3 translation plus 6 rotation dimensions. It ships UNet,
      transformer and spatial-memory UNet variants, plus constrained flow
      matching. The code never mentions the ANYmal: it is platform-agnostic, and
      meant to be reused on other robots.

  - id: anymal-slam-carlo
    name: anymal-slam
    url: https://github.com/carloAdr1/anymal-slam
    visibility: private
    area: SLAM y planificación
    area_en: SLAM and planning
    owner: carloAdr1
    owner_name: carloAdr1
    status: Active
    language: C++ / CUDA
    license: None
    last_push: 2026-09-30
    confidence: confirmed
    description: >-
      Empezó como copia de `ros2-anymal-slam` y ya dejó de serlo. La rama por
      defecto, `genaro-baseline`, conserva intacta la línea base de Genaro
      (commit c666d203); el trabajo propio vive en `develop`, cuatro commits por
      delante, y en dos ramas de planificación A*
      (`feature/astar-planning`, `feature/astar-real-launcher`). Lo añadido
      sobre la línea base: organización de los datos de SLAM y la documentación
      de experimentos, un candidato de build con CUDA 12.8 para Ubuntu 24.04 y
      corrección del QoS del suscriptor de `/scan`. La pila de SLAM en sí sigue
      documentada en [SLAM y localización](/es/docs/05-software/slam).
    description_en: >-
      It started as a copy of `ros2-anymal-slam` and is no longer one. The
      default branch, `genaro-baseline`, keeps Genaro's baseline untouched
      (commit c666d203); the work of its own lives on `develop`, four commits
      ahead, and on two A* planning branches (`feature/astar-planning`,
      `feature/astar-real-launcher`). What has been added on top of the
      baseline: SLAM data layout and experiment documentation, a CUDA 12.8
      build candidate for Ubuntu 24.04, and a QoS fix for the `/scan`
      subscriber. The SLAM stack itself is still documented in
      [SLAM and localisation](/en/docs/05-software/slam).

  - id: anymal-data-management
    name: ANYmal_data_management
    url: https://github.com/Dravid-hex/ANYmal_data_management
    visibility: private
    area: Interfaz de operación
    area_en: Operator interface
    owner: Dravid-hex
    owner_name: Dravid
    status: Active
    language: Python (Tkinter)
    license: None
    last_push: 2026-09-21
    confidence: confirmed
    description: >-
      Aplicación en Tkinter para la pantalla táctil de la Jetson montada como
      payload del ANYmal. Orquesta la cadena de datos completa: arranca y
      monitorea los contenedores de `ros1-anymal-client` y `ros2-anymal-slam`,
      muestra el estado de los tres eslabones (robot, puente ROS 1, puente ROS 2)
      y expone pestañas de acciones, datos ROS, LiDAR y cámaras. Incluye un nodo
      de datos simulados para probar la interfaz sin robot, scripts de prueba
      del inspection payload (barridos pan/tilt sobre ROS 1) y un RViz
      empaquetado en Docker con la configuración del robot.
    description_en: >-
      A Tkinter application for the touchscreen of the Jetson mounted as the
      ANYmal payload. It orchestrates the full data chain: starting and
      monitoring the `ros1-anymal-client` and `ros2-anymal-slam` containers,
      showing the status of all three links (robot, ROS 1 bridge, ROS 2 bridge),
      and exposing tabs for actions, ROS data, LiDAR and cameras. It ships a
      simulated-data node for testing the UI without a robot, test scripts for
      the inspection payload (pan/tilt sweeps over ROS 1), and an RViz packaged
      in Docker with the robot's configuration.

