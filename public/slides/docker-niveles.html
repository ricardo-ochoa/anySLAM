<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipelines en robótica · flujos animados por nivel</title>

<!-- ==========================================================================
     PIPELINES DE DESARROLLO EN ROBÓTICA · diagramas animados por nivel
     Autocontenido. Pensado para incrustarse en un slide.

     USO EN EL DECK
       <iframe src="niveles-flujo-animado.html?nivel=2&theme=dark"
               style="width:100%;height:760px;border:0" loading="lazy"></iframe>

     PARÁMETROS DE URL
       ?nivel=1..N        cuál abre por defecto
       ?theme=light|dark
       ?autoplay=1        arranca solo
       ?tabs=0            oculta las pestañas (para fijar un nivel en un slide)

     CONTROLES
       Botones  · Reproducir / Pausa · ← · Paso → · Reiniciar · velocidad
       Teclado  · Espacio play-pausa · ← → pasos · R reiniciar
                  1 · 2 · 3 … cambian de nivel

     ========================= CÓMO AGREGAR UN NIVEL =========================
     Todo vive en el arreglo LEVELS, al final del <script>. Un nivel es:

       { id, tab, kicker, title, viewBox,
         frames : [ {x,y,w,h,label} ],
         nodes  : [ {id,x,y,w,h,kind,lines:[{t,mono,small}]} ],
         edges  : [ {id,d,kind,label:{t,x,y,w} | {t,x,y,rot}} ],
         steps  : [ {node,edge,extra,kind,who,text} ] }

       kind de nodo : 'pain' rojo · 'hub' azul · 'robot' negro · nada = neutro
       kind de paso : 'pain' pinta la narración en rojo · 'end' cierra
       node         : id del nodo que se enciende
       edge         : arista que recorre la bolita ANTES de encender el nodo
       extra        : aristas que se encienden sin recorrer

     El SVG se dibuja solo a partir de eso: no hay marcado que mantener.
     ========================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600;800&family=Michroma&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0C0D0F; --ink-2:#14161A; --paper:#FFFFFF;
    --g1:#5F6369; --g2:#9A9DA3; --g3:#DBDDD8; --g4:#E7E8E4;
    --tech:'Michroma','Segoe UI',system-ui,sans-serif;
    --doto:'Doto','JetBrains Mono',Consolas,monospace;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --radius:20px;
    --accent:#2F6BFF; --on-accent:#FFFFFF;
    --accent-weak:rgba(47,107,255,.12); --glow:rgba(47,107,255,.40);
    --pain:#F0531C; --pain-weak:#FDE7E0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent}
  body{
    font-family:var(--tech);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;letter-spacing:-.005em;
    display:flex;justify-content:center;padding:14px;
  }
  body[data-theme="dark"]{color:#EEF0F1}

  .wrap{
    width:100%;max-width:1220px;background:var(--paper);
    border:1px solid var(--g3);border-radius:var(--radius);padding:18px 22px 18px;
    box-shadow:0 1px 2px rgba(12,13,15,.04),0 18px 40px -30px rgba(12,13,15,.25);
  }
  body[data-theme="dark"] .wrap{background:var(--ink-2);border-color:rgba(255,255,255,.12);box-shadow:none}

  /* ---------- pestañas de nivel ---------- */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;
    border-bottom:1px solid var(--g3);padding-bottom:12px}
  body[data-theme="dark"] .tabs{border-color:rgba(255,255,255,.12)}
  .tab{font-family:var(--tech);font-size:11.5px;letter-spacing:.02em;cursor:pointer;
    background:transparent;border:1px solid var(--g3);color:var(--g1);
    border-radius:999px;padding:8px 16px;display:inline-flex;align-items:baseline;gap:8px;
    transition:border-color .18s,color .18s,background .18s}
  body[data-theme="dark"] .tab{border-color:rgba(255,255,255,.16);color:#A9AEB4}
  .tab:hover:not(.on){border-color:var(--accent);color:var(--accent)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);
    box-shadow:0 0 22px var(--glow)}
  .tab i{font-family:var(--doto);font-weight:800;font-size:13px;font-style:normal;opacity:.65}
  .tab.on i{opacity:1}
  .tabs.hidden{display:none}

  /* ---------- encabezado ---------- */
  .kicker{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--g1);
    display:inline-flex;align-items:center;gap:9px;margin-bottom:8px}
  body[data-theme="dark"] .kicker{color:#8A8F96}
  .kicker::before{content:"";width:20px;height:2px;background:var(--accent);border-radius:2px}
  h1{font-size:21px;font-weight:400;margin:0 0 4px;letter-spacing:-.015em}
  body[data-theme="dark"] h1{color:#fff}

  /* ---------- lienzo ---------- */
  .stage{width:100%;margin:6px 0 0}
  svg.diagram{width:100%;height:auto;display:block;overflow:visible}

  .node,.edge{transition:opacity .45s ease,filter .45s ease}
  .node,.edge{opacity:.20;filter:grayscale(1)}
  /* los marcos son el mapa, no parte del flujo: el recuadro se atenúa,
     el título se lee completo desde el primer segundo */
  .f-box{opacity:.42}

  .n-box{fill:var(--paper);stroke:var(--g3);stroke-width:1.5;transition:fill .4s ease,stroke .4s ease}
  body[data-theme="dark"] .n-box{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.14)}
  .n-t{font-size:12.5px;fill:var(--ink);letter-spacing:-.01em}
  body[data-theme="dark"] .n-t{fill:#EAECEE}
  .n-t.mono{font-family:var(--mono);font-weight:500;letter-spacing:0}
  .n-t.small{font-size:10.5px;opacity:.72}

  .node.on{opacity:1;filter:none}
  .node.on .n-box{stroke:var(--accent);stroke-width:2}

  .node.on.pain .n-box{fill:var(--pain-weak);stroke:var(--pain);stroke-width:2}
  body[data-theme="dark"] .node.on.pain .n-box{fill:rgba(240,83,28,.16)}
  .node.on.pain .n-t{fill:#7A2A0D}
  body[data-theme="dark"] .node.on.pain .n-t{fill:#FFCBB6}

  .node.on.hub .n-box{fill:var(--accent-weak);stroke:var(--accent);stroke-width:2.5}
  body[data-theme="dark"] .node.on.hub .n-box{fill:rgba(47,107,255,.22)}

  .node.on.robot .n-box{fill:var(--ink);stroke:var(--ink)}
  body[data-theme="dark"] .node.on.robot .n-box{fill:#000;stroke:rgba(255,255,255,.25)}
  .node.robot.on .n-t{fill:#fff}

  .n-ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
  .node.pain .n-ring{stroke:var(--pain)}
  .node.active .n-ring{animation:ring 1.5s ease-out infinite}
  @keyframes ring{
    0%{opacity:.55;transform:scale(1)}
    70%{opacity:0;transform:scale(1.045)}
    100%{opacity:0;transform:scale(1.045)}
  }
  .node.active .n-box{filter:drop-shadow(0 0 16px var(--glow))}
  .node.active.pain .n-box{filter:drop-shadow(0 0 16px rgba(240,83,28,.45))}

  .e-path{fill:none;stroke:var(--g2);stroke-width:2;stroke-linecap:round}
  body[data-theme="dark"] .e-path{stroke:#6E757D}
  .edge.on{opacity:1;filter:none}
  .edge.on .e-path{stroke:var(--accent)}
  .edge.on.pain .e-path{stroke:var(--pain);stroke-dasharray:7 6}
  .e-lbl{font-size:10.5px;fill:var(--g1);letter-spacing:.02em}
  body[data-theme="dark"] .e-lbl{fill:#9CA1A7}
  .edge.on .e-lbl{fill:var(--ink)}
  body[data-theme="dark"] .edge.on .e-lbl{fill:#E4E7EA}
  .e-lbl-bg{fill:var(--paper)}
  body[data-theme="dark"] .e-lbl-bg{fill:var(--ink-2)}

  .f-box{fill:none;stroke:var(--g3);stroke-width:1.5;stroke-dasharray:6 7}
  body[data-theme="dark"] .f-box{stroke:rgba(255,255,255,.18)}
  .f-t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;fill:var(--g1)}
  body[data-theme="dark"] .f-t{fill:#B7BCC2}
  .f-tick{fill:var(--accent)}

  #token{opacity:0;pointer-events:none}
  #token .core{fill:var(--accent)}
  #token .halo{fill:var(--accent);opacity:.22}
  #token.pain .core,#token.pain .halo{fill:var(--pain)}

  /* ---------- narración ---------- */
  .caption{display:flex;gap:16px;align-items:flex-start;margin-top:14px;
    padding:15px 18px;min-height:78px;background:var(--accent-weak);
    border:1px solid var(--g3);border-radius:14px;transition:background .4s,border-color .4s}
  body[data-theme="dark"] .caption{border-color:rgba(255,255,255,.12)}
  .caption.pain{background:rgba(240,83,28,.10);border-color:rgba(240,83,28,.38)}
  .cap-n{font-family:var(--doto);font-weight:800;font-size:20px;color:var(--accent);min-width:34px;line-height:1.3}
  .caption.pain .cap-n{color:var(--pain)}
  .cap-b{flex:1}
  .cap-who{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--g2);margin-bottom:3px}
  .cap-tx{font-size:14px;color:var(--ink);margin:0;line-height:1.55}
  body[data-theme="dark"] .cap-tx{color:#DCDFE3}

  /* ---------- controles ---------- */
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--tech);font-size:12.5px;
    background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;
    padding:10px 20px;cursor:pointer;box-shadow:0 0 24px var(--glow)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--g3);box-shadow:none}
  body[data-theme="dark"] .btn.ghost{color:#fff;border-color:rgba(255,255,255,.24)}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none}
  .btn.ghost:hover:not(:disabled){border-color:var(--accent)}

  .spd{display:flex;gap:5px;margin-left:auto;align-items:center}
  .spd span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--g2);margin-right:4px}
  .spd button{font-family:var(--doto);font-weight:600;font-size:12px;background:transparent;
    border:1px solid var(--g3);color:var(--g1);border-radius:999px;padding:6px 12px;cursor:pointer}
  body[data-theme="dark"] .spd button{border-color:rgba(255,255,255,.18);color:#AEB2B8}
  .spd button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  .prog{height:3px;background:var(--g4);border-radius:3px;overflow:hidden;margin-top:14px}
  body[data-theme="dark"] .prog{background:rgba(255,255,255,.10)}
  .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
  .cnt{font-family:var(--doto);font-weight:600;font-size:12px;color:var(--g2);letter-spacing:.06em}
  .cnt b{color:var(--accent);font-weight:600}

  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

  @media (prefers-reduced-motion:reduce){
    .node.active .n-ring{animation:none}
    .node,.edge,.frame,.caption,.prog i{transition-duration:.01ms}
  }
  @media (max-width:760px){
    .wrap{padding:14px}
    h1{font-size:16px}
    .btn{padding:9px 14px;font-size:11.5px}
    .spd{margin-left:0}
    .tab{padding:7px 12px;font-size:11px}
  }
</style>
</head>
<body data-theme="light">

<div class="wrap">

  <div class="tabs" id="tabs" role="tablist" aria-label="Nivel de madurez"></div>

  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>

  <div class="stage" id="stage"></div>

  <div class="caption" id="cap">
    <div class="cap-n" id="capN">—</div>
    <div class="cap-b">
      <div class="cap-who" id="capWho"></div>
      <p class="cap-tx" id="capTx"></p>
    </div>
  </div>

  <div class="prog"><i id="prog"></i></div>

  <div class="bar">
    <button class="btn" id="play">▶&nbsp; Reproducir</button>
    <button class="btn ghost" id="prev">←</button>
    <button class="btn ghost" id="next">Paso &nbsp;→</button>
    <button class="btn ghost" id="reset">Reiniciar</button>
    <span class="cnt"><b id="cur">0</b> / <span id="tot">0</span></span>
    <div class="spd">
      <span>Velocidad</span>
      <button data-spd="0.6">0.6×</button>
      <button data-spd="1" class="on">1×</button>
      <button data-spd="1.8">1.8×</button>
    </div>
  </div>

</div>

<script>
/* ============================================================
   MOTOR · no necesitas tocar nada de aquí para agregar niveles
   ============================================================ */
const $ = s => document.querySelector(s);
const stage=$('#stage'), tabsEl=$('#tabs'), capBox=$('#cap'), capN=$('#capN'),
      capWho=$('#capWho'), capTx=$('#capTx'), prog=$('#prog'), curEl=$('#cur'), totEl=$('#tot'),
      btnPlay=$('#play'), btnNext=$('#next'), btnPrev=$('#prev'), btnReset=$('#reset');

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LH = 19;                       // alto de línea dentro de un nodo
let L, i = -1, playing = false, speed = 1, run = 0, token;

const sleep = ms => new Promise(r => setTimeout(r, ms / speed));
const node  = id => document.getElementById('n-' + id);
const esc   = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- dibuja el SVG de un nivel ---------- */
function buildSVG(lv){
  const frames = lv.frames.map(f => `
    <g class="frame">
      <rect class="f-box" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="18"/>
      <rect class="f-tick" x="${f.x + 18}" y="${f.y - 15}" width="14" height="2" rx="1"/>
      <text class="f-t" x="${f.x + 38}" y="${f.y - 10}">${esc(f.label)}</text>
    </g>`).join('');

  const edges = lv.edges.map(e => {
    let lbl = '';
    if (e.label){
      const t = e.label;
      if (t.rot){
        lbl = `<text class="e-lbl" x="${t.x}" y="${t.y}" text-anchor="middle"
                 transform="rotate(${t.rot} ${t.x} ${t.y})">${esc(t.t)}</text>`;
      } else {
        const w = t.w || (t.t.length * 6.6 + 16);
        lbl = `<rect class="e-lbl-bg" x="${t.x - w/2}" y="${t.y - 13}" width="${w}" height="18" rx="6"/>
               <text class="e-lbl" x="${t.x}" y="${t.y}" text-anchor="middle">${esc(t.t)}</text>`;
      }
    }
    return `<g class="edge ${e.kind || ''}" id="${e.id}">
              <path class="e-path" d="${e.d}" marker-end="url(#ah)"/>${lbl}
            </g>`;
  }).join('');

  const nodes = lv.nodes.map(n => {
    const cx = n.x + n.w/2, cy = n.y + n.h/2;
    const first = cy - (n.lines.length - 1) * LH/2 + 6;
    const txt = n.lines.map((l, k) =>
      `<text class="n-t${l.mono?' mono':''}${l.small?' small':''}" x="${cx}" y="${first + k*LH}"
         text-anchor="middle">${esc(l.t)}</text>`).join('');
    return `<g class="node ${n.kind || ''}" id="n-${n.id}">
              <rect class="n-ring" x="${n.x-4}" y="${n.y-4}" width="${n.w+8}" height="${n.h+8}" rx="15"/>
              <rect class="n-box"  x="${n.x}"   y="${n.y}"   width="${n.w}"   height="${n.h}"   rx="13"/>
              ${txt}
            </g>`;
  }).join('');

  stage.innerHTML = `
    <svg class="diagram" viewBox="${lv.viewBox}" role="img" aria-label="${esc(lv.title)}">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
                orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/>
        </marker>
      </defs>
      ${frames}${edges}${nodes}
      <g id="token"><circle class="halo" r="13"/><circle class="core" r="5.5"/></g>
    </svg>`;
  token = document.getElementById('token');
}

/* ---------- estado del diagrama hasta el paso n, sin animar ---------- */
function paint(n){
  document.querySelectorAll('.node').forEach(e => e.classList.remove('on','active'));
  document.querySelectorAll('.edge').forEach(e => {
    e.classList.remove('on');
    const p = e.querySelector('.e-path');
    p.style.strokeDasharray = ''; p.style.strokeDashoffset = '';
  });
  token.style.opacity = 0;

  for (let k = 0; k <= n; k++){
    const s = L.steps[k];
    if (s.edge) document.getElementById(s.edge).classList.add('on');
    (s.extra || []).forEach(id => document.getElementById(id).classList.add('on'));
    if (s.node) node(s.node).classList.add('on');
  }
  const last = L.steps[n];
  if (last && last.node) node(last.node).classList.add('active');
  if (last && isFinal(last.kind)) finish(last.kind);
  caption(n);
}

/* cierre del guion: 'end' deja latiendo los puntos de dolor,
   'done' apaga todo foco (niveles que terminan sin nada en rojo) */
function finish(kind){
  document.querySelectorAll('.node.on').forEach(e => e.classList.remove('active'));
  if (kind === 'end') document.querySelectorAll('.node.pain.on').forEach(e => e.classList.add('active'));
}
const isFinal = k => k === 'end' || k === 'done';

function caption(n){
  const s = L.steps[n];
  if (!s){
    capN.textContent = '—';
    capWho.textContent = 'Listo para empezar';
    capTx.textContent = 'Presiona Reproducir para recorrer el flujo etapa por etapa. Todo arranca apagado: cada paso se enciende cuando le toca.';
    capBox.classList.remove('pain');
  } else {
    capN.textContent = String(n + 1).padStart(2,'0');
    capWho.textContent = s.who;
    capTx.textContent = s.text;
    capBox.classList.toggle('pain', s.kind === 'pain' || s.kind === 'end');
  }
  curEl.textContent = n + 1;
  prog.style.width = ((n + 1) / L.steps.length * 100) + '%';
  btnPrev.disabled = n < 0;
  btnNext.disabled = n >= L.steps.length - 1;
}

/* ---------- la bolita recorre una arista mientras se dibuja ---------- */
function travel(edgeEl, ms){
  return new Promise(resolve => {
    const path = edgeEl.querySelector('.e-path');
    const len = path.getTotalLength();
    edgeEl.classList.add('on');
    token.classList.toggle('pain', edgeEl.classList.contains('pain'));

    if (reduce){ token.style.opacity = 0; return resolve(); }

    path.style.strokeDasharray  = len + ' ' + len;
    path.style.strokeDashoffset = len;
    token.style.opacity = 1;

    const t0 = performance.now(), dur = ms / speed, mine = run;
    (function frame(t){
      if (mine !== run){ token.style.opacity = 0; return resolve(); }
      const raw = Math.min(1, (t - t0) / dur);
      const e = raw < .5 ? 2*raw*raw : 1 - Math.pow(-2*raw + 2, 2)/2;   // easeInOutQuad
      const pt = path.getPointAtLength(e * len);
      token.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
      path.style.strokeDashoffset = len * (1 - e);
      if (raw < 1) requestAnimationFrame(frame);
      else { token.style.opacity = 0; path.style.strokeDasharray = ''; resolve(); }
    })(performance.now());
  });
}

async function step(n){
  const mine = ++run;
  i = n;
  paint(n - 1);                       // reconstruye lo anterior de golpe
  const s = L.steps[n];
  (s.extra || []).forEach(id => document.getElementById(id).classList.add('on'));

  if (s.edge){ await travel(document.getElementById(s.edge), 950); if (mine !== run) return; }
  if (s.node){
    node(s.node).classList.add('on','active');
    await sleep(reduce ? 10 : 260); if (mine !== run) return;
  }
  if (isFinal(s.kind)) finish(s.kind);
  caption(n);
}

async function play(){
  playing = true; setPlayBtn();
  if (i >= L.steps.length - 1){ i = -1; paint(-1); await sleep(300); }
  for (let n = i + 1; n < L.steps.length; n++){
    await step(n);
    if (!playing) return;
    await sleep(1100 + Math.min(3200, L.steps[n].text.length * 26));   // pausa según lo que hay que leer
    if (!playing) return;
  }
  playing = false; setPlayBtn();
}

function pause(){ playing = false; setPlayBtn(); }
function setPlayBtn(){
  const last = L ? L.steps.length - 1 : 0;      // en el primer load() aún no hay nivel
  btnPlay.innerHTML = playing ? '❚❚&nbsp; Pausa'
    : (i >= last ? '↻&nbsp; Repetir' : '▶&nbsp; Reproducir');
}

/* ---------- cambio de nivel ---------- */
function load(id){
  pause(); run++;
  L = LEVELS.find(l => l.id === id) || LEVELS[0];
  $('#kicker').textContent = L.kicker;
  $('#title').textContent  = L.title;
  totEl.textContent = L.steps.length;
  [...tabsEl.children].forEach(b => {
    const on = +b.dataset.id === L.id;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on);
  });
  buildSVG(L);
  i = -1; paint(-1); setPlayBtn();
}

LEVELS_TABS: {
  // se llena abajo, después de definir LEVELS
}

btnPlay.onclick  = () => playing ? pause() : play();
btnNext.onclick  = () => { pause(); if (i < L.steps.length - 1) step(i + 1); };
btnPrev.onclick  = () => { pause(); i = Math.max(-1, i - 1); run++; paint(i); setPlayBtn(); };
btnReset.onclick = () => { pause(); i = -1; run++; paint(-1); setPlayBtn(); };

document.querySelectorAll('.spd button').forEach(b => b.onclick = () => {
  speed = parseFloat(b.dataset.spd);
  document.querySelectorAll('.spd button').forEach(x => x.classList.toggle('on', x === b));
});

addEventListener('keydown', e => {
  if (e.key === ' ')          { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); btnNext.click(); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); btnPrev.click(); }
  if (e.key === 'r' || e.key === 'R') btnReset.click();
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9 && LEVELS.some(l => l.id === n)) load(n);
});
